name: Build and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target "$TARGET"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "$version"
      - name: Check and test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +stable fmt --check
          cargo +stable clippy --locked --all-targets --target "$TARGET" -- -D warnings
          cargo +stable test --locked --target "$TARGET"
          bash -n scripts/*.sh
      - name: Build static release archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +stable build --release --locked --target "$TARGET"
          if readelf -l "target/$TARGET/release/docker-dns" | grep -q INTERP; then
            echo 'Release binary must be static.' >&2
            exit 1
          fi
          ./scripts/package.sh "${TARGET%%-*}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" *.tar.gz SHA256SUMS --verify-tag --draft --generate-notes
